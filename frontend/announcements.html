<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements — Campus Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Archivo:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="app-body">

<header class="app-header">
  <div class="app-header-inner">
    <a class="wordmark" href="dashboard.html">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="6" r="3" fill="#B97D7B"/>
        <circle cx="6" cy="11" r="3" fill="#B97D7B"/>
        <circle cx="14" cy="11" r="3" fill="#DDD3C9"/>
        <circle cx="10" cy="14" r="2.4" fill="#7E745B"/>
      </svg>
      Campus Board
    </a>
    <nav class="main-nav" id="app-nav">
      <a href="dashboard.html">Home</a>
      <a href="announcements.html" class="is-current">Announcements</a>
      <a href="opportunities.html">Opportunities</a>
      <a href="calendar.html">Calendar</a>
      <a href="profile.html">My Profile</a>
    </nav>
    <div class="app-header-actions">
      <div class="app-search">
        <input type="search" id="global-search" placeholder="Search announcements, opportunities…" aria-label="Search Campus Board">
        <div class="app-search-results" id="search-results" hidden></div>
      </div>
      <div class="app-notif">
        <button class="notif-btn" id="notif-btn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
          🔔<span class="notif-dot" id="notif-dot" hidden></span>
        </button>
        <div class="notif-dropdown" id="notif-dropdown" hidden>
          <div class="notif-dropdown-head"><span>Notifications</span><button type="button" id="notif-mark-all">Mark all as read</button></div>
          <div class="notif-list" id="notif-list"></div>
        </div>
      </div>
      <a class="app-avatar" href="profile.html" id="app-avatar">S</a>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="app-nav" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main class="dash-main">
  <div class="page-head">
    <span class="hand-note">okay, this one's important →</span>
    <h1>Announcements</h1>
    <p>Everything posted for your class and campus, in one feed.</p>
  </div>

  <div class="filter-bar">
    <input type="search" class="page-search" id="page-search" placeholder="Search announcements…" aria-label="Search announcements">
    <div class="filter-chips" id="category-chips">
      <button class="filter-chip is-active" data-category="All" type="button">All</button>
      <button class="filter-chip" data-category="Academic" type="button">Academic</button>
      <button class="filter-chip" data-category="Class" type="button">Class</button>
      <button class="filter-chip" data-category="Society" type="button">Society</button>
      <button class="filter-chip" data-category="General" type="button">General</button>
      <button class="filter-chip" data-category="Important" type="button">Important</button>
    </div>
    <select class="sort-select" id="sort-select">
      <option value="newest">Newest first</option>
      <option value="deadline">Deadline soonest</option>
      <option value="priority">Priority: high first</option>
    </select>
  </div>

  <div class="results-grid" id="announcements-grid"></div>
</main>

<script src="js/main.js"></script>
<script src="js/announcements.js"></script>
</body>
</html>
