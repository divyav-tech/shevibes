<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Campus Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Archivo:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="app-body">

<header class="app-header">
  <div class="app-header-inner">
    <a class="wordmark" href="dashboard.html">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="6" r="3" fill="#C45F62"/>
        <circle cx="6" cy="11" r="3" fill="#B97D7B"/>
        <circle cx="14" cy="11" r="3" fill="#DDD3C9"/>
        <circle cx="10" cy="14" r="2.4" fill="#6F674F"/>
      </svg>
      Campus Board
    </a>
    <nav class="main-nav" id="app-nav">
      <a href="dashboard.html">Home</a>
      <a href="announcements.html">Announcements</a>
      <a href="opportunities.html">Opportunities</a>
      <a href="calendar.html" class="is-current">Calendar</a>
      <a href="profile.html">My Profile</a>
    </nav>
    <div class="app-header-actions">
      <div class="app-search">
        <input type="search" id="global-search" placeholder="Search announcements, opportunities…" aria-label="Search Campus Board">
        <div class="app-search-results" id="search-results" hidden></div>
      </div>
      <div class="app-notif">
        <button class="notif-btn" id="notif-btn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
          🔔<span class="notif-dot" id="notif-dot" hidden></span>
        </button>
        <div class="notif-dropdown" id="notif-dropdown" hidden>
          <div class="notif-dropdown-head"><span>Notifications</span><button type="button" id="notif-mark-all">Mark all as read</button></div>
          <div class="notif-list" id="notif-list"></div>
        </div>
      </div>
      <a class="app-avatar" href="profile.html" id="app-avatar">S</a>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="app-nav" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main class="dash-main">
  <div class="calendar-scrapbook">
    <span class="paper-layer paper-layer-back" aria-hidden="true"></span>
    <span class="paper-layer paper-layer-mid" aria-hidden="true"></span>

    <div class="main-calendar-paper">
      <div class="calendar-header">
        <button class="calendar-nav-arrow" id="cal-prev" type="button" aria-label="Previous month">←</button>
        <div class="calendar-header-titles">
          <h1 id="calendar-month-title">September</h1>
          <p class="calendar-header-hand">little things to remember ✦</p>
        </div>
        <button class="calendar-nav-arrow" id="cal-next" type="button" aria-label="Next month">→</button>
      </div>
      <span class="calendar-annotation">don't forget these →</span>

      <div class="calendar-tabs">
        <button class="calendar-tab is-active" id="tab-month" type="button">Month View</button>
        <button class="calendar-tab" id="tab-upcoming" type="button">Upcoming</button>
      </div>

      <div id="month-view">
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

      <div id="upcoming-view" hidden>
        <p class="calendar-header-hand">pin these somewhere in your brain</p>
        <div class="upcoming-timeline" id="upcoming-list"></div>
      </div>
    </div>

    <svg class="calendar-doodle doodle-star" width="30" height="30" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <path d="M9 0L10.8 6.4L17 9L10.8 11.6L9 18L7.2 11.6L1 9L7.2 6.4L9 0Z" fill="#B97D7B"/>
    </svg>
    <svg class="calendar-doodle doodle-arrow" width="50" height="40" viewBox="0 0 50 40" fill="none" aria-hidden="true">
      <path d="M4 6C14 20 26 30 46 34" stroke="#6F674F" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M46 34C41 33 37 30 36 25" stroke="#6F674F" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M46 34C45 29 43 26 38 24" stroke="#6F674F" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <svg class="calendar-doodle doodle-heart" width="22" height="20" viewBox="0 0 20 18" fill="none" aria-hidden="true">
      <path d="M10 17C4 12.5 0 9 0 5.2 0 2.3 2.2 0 5 0c1.9 0 3.6 1.1 5 3 1.4-1.9 3.1-3 5-3 2.8 0 5 2.3 5 5.2 0 3.8-4 7.3-10 11.8z" fill="#C45F62"/>
    </svg>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
