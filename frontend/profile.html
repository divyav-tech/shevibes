<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Campus Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Archivo:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="app-body">

<header class="app-header">
  <div class="app-header-inner">
    <a class="wordmark" href="dashboard.html">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="6" r="3" fill="#B97D7B"/>
        <circle cx="6" cy="11" r="3" fill="#B97D7B"/>
        <circle cx="14" cy="11" r="3" fill="#DDD3C9"/>
        <circle cx="10" cy="14" r="2.4" fill="#7E745B"/>
      </svg>
      Campus Board
    </a>
    <nav class="main-nav" id="app-nav">
      <a href="dashboard.html">Home</a>
      <a href="announcements.html">Announcements</a>
      <a href="opportunities.html">Opportunities</a>
      <a href="calendar.html">Calendar</a>
      <a href="past-events.html">Past Events</a>
      <a href="profile.html" class="is-current">My Profile</a>
    </nav>
    <div class="app-header-actions">
      <div class="app-search">
        <input type="search" id="global-search" placeholder="Search announcements, opportunities…" aria-label="Search Campus Board">
        <div class="app-search-results" id="search-results" hidden></div>
      </div>
      <div class="app-notif">
        <button class="notif-btn" id="notif-btn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
          🔔<span class="notif-dot" id="notif-dot" hidden></span>
        </button>
        <div class="notif-dropdown" id="notif-dropdown" hidden>
          <div class="notif-dropdown-head"><span>Notifications</span><button type="button" id="notif-mark-all">Mark all as read</button></div>
          <div class="notif-list" id="notif-list"></div>
        </div>
      </div>
      <a class="app-avatar" href="profile.html" id="app-avatar">S</a>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="app-nav" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main class="dash-main">
  <div class="page-head">
    <span class="hand-note">your little campus corner →</span>
    <h1>My Campus Corner ✦</h1>
    <p>Your Campus Board, personalized around this.</p>
  </div>

  <div class="profile-grid">
    <div class="profile-card tone-cream" style="padding-top:26px;">
      <div class="profile-photo-row">
        <button class="polaroid polaroid-lg polaroid-upload" type="button" data-polaroid-id="profile-photo" style="--rot:-2deg;position:relative;">
          <div class="photo-block"></div>
          <span class="polaroid-caption">this is me ✦</span>
        </button>
        <div class="profile-photo-info">
          <div class="profile-avatar-lg" id="profile-avatar-lg" style="margin:0 0 10px;">S</div>
          <p style="font-weight:600;font-size:1.15rem;font-family:var(--font-display);" id="profile-summary-name">Your name</p>
          <p style="font-weight:600;font-size:1.0rem;" id="profile-summary-role">Regular Student</p>
          <p style="color:var(--color-text-muted);font-size:0.88rem;margin-top:4px;" id="profile-summary-class">1st Year · CSE · Section A</p>
        </div>
      </div>

      <div class="profile-field" style="margin-top:22px;">
        <label for="edit-name">Your name</label>
        <input id="edit-name" type="text" placeholder="e.g. Divya">
      </div>
      <div class="profile-field">
        <label for="edit-role">Role</label>
        <select id="edit-role">
          <option>Regular Student</option>
          <option>Class Representative</option>
        </select>
      </div>
      <div class="profile-field">
        <label for="edit-year">Year</label>
        <select id="edit-year">
          <option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option>
        </select>
      </div>
      <div class="profile-field">
        <label for="edit-branch">Branch</label>
        <select id="edit-branch">
          <option>CSE</option><option>CSE-AI</option><option>ECE</option><option>EEE</option><option>IT</option><option>Other</option>
        </select>
      </div>
      <div class="profile-field">
        <label for="edit-section">Section</label>
        <select id="edit-section">
          <option>A</option><option>B</option><option>C</option><option>D</option><option>Other</option>
        </select>
      </div>

      <div class="profile-field">
        <label>Interests</label>
        <div class="profile-interests" id="edit-interests">
          <button class="filter-chip" type="button" data-value="Academics">📚 Academics</button>
          <button class="filter-chip" type="button" data-value="Tech">💻 Tech</button>
          <button class="filter-chip" type="button" data-value="Societies">🎭 Societies</button>
          <button class="filter-chip" type="button" data-value="Competitions">🏆 Competitions</button>
          <button class="filter-chip" type="button" data-value="Scholarships">💰 Scholarships</button>
          <button class="filter-chip" type="button" data-value="Events">🎤 Events</button>
          <button class="filter-chip" type="button" data-value="Volunteering">🤝 Volunteering</button>
          <button class="filter-chip" type="button" data-value="Workshops">🛠️ Workshops</button>
        </div>
      </div>

      <div class="profile-actions">
        <button class="btn btn-primary" type="button" id="save-profile">Update Profile</button>
      </div>
      <button class="profile-danger" type="button" id="sign-out">Sign Out</button>
      <button class="profile-danger" type="button" id="reset-personalization">Reset Personalization</button>
    </div>

    <div>
      <div class="section-divider" style="margin-top:0;">
        <h2>Saved Items</h2>
        <p id="saved-count-line">0 saved</p>
      </div>
      <div class="saved-list" id="saved-list"></div>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
